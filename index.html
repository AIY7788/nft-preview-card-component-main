<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="stylesheet" href="./src/output.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | NFT preview card component</title>
</head>

<body class="min-h-screen font-family font-normal bg-main text-blue-500 py-14 px-5 flex items-center">

  <main class="max-w-85 bg-card p-5 rounded-xl w-fit mx-auto">
    <div class="relative">
      <img class="rounded-lg" src="./images/image-equilibrium.jpg" alt="equilibrium">
      <div class="peer absolute inset-0 rounded-lg cursor-pointer opacity-0 transition-colors duration-400 hover:opacity-40 hover:bg-cyan-400">
      </div>
      <img class="absolute pointer-events-none transition-colors duration-400 opacity-0 peer-hover:opacity-100 top-2/4 left-2/4 -translate-2/4" src="./images/icon-view.svg" alt="icon-view">
    </div>
    <h1 class="mt-5 font-bold text-white text-xl cursor-pointer transition-colors duration-200 hover:text-cyan-400">Equilibrium #3429</h1>

    <p class="mt-3">Our Equilibrium collection promotes balance and calm.</p>
    <div class="mt-3 pb-3 flex items-center justify-between border-b border-line">
      <span class="flex items-center gap-2 font-medium text-cyan-400">
        <img src="./images/icon-ethereum.svg" alt="ethereum">
        0.041 ETH
      </span>
      <span class="flex items-center gap-2">
        <img src="./images/icon-clock.svg" alt="clock">
        3 days left
      </span>
    </div>
    <div class="mt-4 flex items-center gap-4">
      <img class="size-10 border-2 rounded-full" src="./images/image-avatar.png" alt="avatar">
      <p>Creation of <span class="text-white transition-colors duration-200 cursor-pointer hover:text-cyan-400">Jules Wyvern</span></p>
    </div>
  </main>

  <div class="text-xs fixed bottom-2 text-center left-1/2 -translate-x-1/2">
    Challenge by <a class="text-cyan-500 transition-colors duration-100 hover:text-cyan-200" href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
    Coded by <a class="text-cyan-500 transition-colors duration-100 hover:text-cyan-200" href="https://www.frontendmentor.io/profile/AIY7788">Alex</a>.
  </div>
</body>

</html>
